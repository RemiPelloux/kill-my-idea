name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: CSP hashes are pinned
        run: python3 scripts/update-csp.py --check

      - name: Template safety scan
        run: python3 scripts/scan-report.py

      - name: Check example ideas
        run: |
          found=0
          while IFS= read -r v; do
            found=1
            dir=$(dirname "$v")
            echo "::group::check-idea $dir"
            python3 scripts/check-idea.py "$dir"
            echo "::endgroup::"
          done < <(find examples -name verdict.json -type f | sort)
          if [ "$found" = 0 ]; then echo "No examples with verdict.json, skipping."; fi

      - name: Check legacy example reports (rule errors warn, safety errors fail)
        run: |
          for d in examples/*-report; do python3 scripts/check-idea.py --legacy "$d"; done

      - name: Build the dashboard and brain from the examples
        run: |
          tmp=$(mktemp -d)
          for d in examples/*-report; do cp -r "$d" "$tmp/$(basename "$d" -report)"; done
          python3 scripts/build-brain.py "$tmp"
          python3 scripts/check-idea.py --board "$tmp"
          grep -q "kmi:auto:end" "$tmp/BRAIN.md"

      - name: Schemas are valid JSON
        run: |
          find . -name '*.schema.json' -not -path './.git/*' -print0 \
            | xargs -0 -I{} sh -c 'python3 -m json.tool "{}" > /dev/null && echo "ok {}"'
